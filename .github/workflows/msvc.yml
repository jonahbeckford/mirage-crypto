name: msvc

on:
  push:
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up OCaml 4.14 with MSVC
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "4.14"
          windows-compiler: msvc

      - run: opam install ./mirage-crypto.opam ./mirage-crypto-rng.opam ./mirage-crypto-ec.opam --deps-only --with-test
      - run: opam exec -- dune build -p mirage-crypto,mirage-crypto-rng,mirage-crypto-ec
      - run: opam exec -- dune runtest -p mirage-crypto,mirage-crypto-rng,mirage-crypto-ec
